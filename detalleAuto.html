<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle del Auto</title>

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/detalleAuto.css">
</head>

<body>

    <header class="cabecera">
        <div class="contenedor cabecera-contenido">

            <a class="marca" href="inicio.html">
                autos copados
            </a>

            <nav>
                <ul class="menu">

                    <li>
                        <a href="inicio.html">Inicio</a>
                    </li>

                    <li>
                        <a href="login.html">LOG IN</a>
                    </li>

                    <li>
                        <a href="registro.html">Registrarse</a>
                    </li>

                </ul>
            </nav>

        </div>
    </header>


    <main class="DetalleAuto">

        <section class="detalle-auto">

            <img
                id="imagenAuto"
                src=""
                alt="Imagen del auto"
            >

            <div class="detalle-info">

                <h1 id="nombreAuto"></h1>

                <h2 id="precioAuto"></h2>

                <p>
                    <strong>Marca:</strong>
                    <span id="marcaAuto"></span>
                </p>

                <p>
                    <strong>Modelo:</strong>
                    <span id="modeloAuto"></span>
                </p>

                <p>
                    <strong>Año:</strong>
                    <span id="anioAuto"></span>
                </p>

                <p>
                    <strong>Kilómetros:</strong>
                    <span id="kilometrosAuto"></span>
                </p>

                <p>
                    <strong>Combustible:</strong>
                    <span id="combustibleAuto"></span>
                </p>

                <p>
                    <strong>Transmisión:</strong>
                    <span id="transmisionAuto"></span>
                </p>

                <p>
                    <strong>Vendedor:</strong>
                    <span id="vendedorAuto"></span>
                </p>


                

                <div id="opcionesComprador" class="oculto">

                    <a class="boton" href="#">
                        Comprar Ahora
                    </a>

                    <a class="boton" href="#">
                        Agregar al Carrito
                    </a>

                </div>


                

                <div id="opcionesVendedor" class="oculto">

                    <button class="boton">
                        Modificar
                    </button>

                    <button class="boton">
                        Eliminar
                    </button>

                </div>


            

                <div id="opcionesAdministrador" class="oculto">

                    <button class="boton">
                        Modificar publicación
                    </button>

                    <button class="boton">
                        Eliminar publicación
                    </button>

                    <button class="boton">
                        Dar de baja
                    </button>

                </div>

            </div>

        </section>


        <div id="PreguntasComentarios">

            <section>

                <form action="#" method="post" id="Pregunta">

                    <div>

                        <label for="PreguntaComprador">
                            Pregunta:
                        </label>

                        <input
                            type="text"
                            name="PreguntaComprador"
                            id="PreguntaComprador"
                            required
                        >

                    </div>

                    <button
                        id="boton-guardar"
                        class="boton"
                        type="submit"
                    >
                        Enviar
                    </button>

                </form>

                <a class="boton">
                    Ver Preguntas
                </a>

            </section>


            <section>

                <div class="comentarios">

                    <h2>Comentarios</h2>

                    <div id="listaComentarios"></div>

                </div>

            </section>

        </div>

    </main>


    <footer class="pie">
        <div class="contenedor">

            <p>
                autos copados - Proyecto PWM
            </p>

        </div>
    </footer>


    <script src="./js/detalleAuto.js"></script>

</body>

</html>
