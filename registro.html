<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autos Copados | Registro</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="./css/LoginRegistrase.css">
</head>

<body>

    <header class="cabecera">
        <div class="contenedor cabecera-contenido">
            <a class="marca" href="inicio.html">autos copados</a>
            <nav aria-label="Navegación principal">
                <ul class="menu">
                    <li><a href="inicio.html">Inicio</a></li>
                    <li><a href="login.html">LOG IN</a></li>
                    <li><a class="activo" href="registro.html">Registrarse</a></li>

                </ul>
            </nav>
        </div>
    </header>
    <main class="formulario Registro">
        <div class="ImagenPublicidad">
            <img src="./img/Anuncio/anuncio3.webp" alt="">
        </div>
        <div id="DatosRegistro">
            <section>
                <h1>Registrar nuevo usuario</h1>
                <p>Completá con tus datos</p>
            </section>

            <section>
                <form id="formulario-registro" class="" action="#" method="post">
                    
                    <div class="">
                        <div class="titulo">
                            <label for="correo-usuario">Nombre:</label>
                            <div class="icono">
                                <img src="./img/bienmal.jpg" alt="" class="iconoIMG">
                            </div>
                        </div>
                        <input id="nombre" name="nombre" type="text" >
                    </div>
                    
                    <div class="">
                        <div class="titulo">
                        <label for="correo-usuario">Apellido:</label>
                        <div class="icono">
                            <img src="./img/bienmal.jpg" alt="" class="iconoIMG">
                        </div>
                    </div>
                        <input id="apellido" name="apellido" type="text" >
                    </div>
    
                    <div class="">
                        <div class="titulo">
                            <label for="correo-usuario">Correo de usuario</label>
                            <div class="icono">
                                <img src="./img/bienmal.jpg" alt="" class="iconoIMG">
                            </div>
                        </div>
                        <input id="correo" name="correo" type="email" >
                    </div>
                    
                    <div class="">
                        <div class="titulo">
                            <label for="correo-usuario">Clave:</label>
                            <div class="icono">
                                <img src="./img/bienmal.jpg" alt="" class="iconoIMG">
                            </div>
                        </div>
                        <input id="clave" name="clave" type="text">
                    </div>
    
                    <div class="">
                        <div class="titulo">
                            <label for="correo-usuario">Confirmar clave:</label>
                            <div class="icono">
                                <img src="./img/bienmal.jpg" alt="" class="iconoIMG">
                            </div>
                        </div>
                        <input id="clave" name="clave" type="text">
                    </div>
    
                    <div class="">
                        <div class="titulo">
                            <label for="correo-usuario">Fecha de Nacimiento:</label>
                            <div class="icono">
                                <img src="./img/bienmal.jpg" alt="" class="iconoIMG">
                            </div>
                        </div>
                        <input id="fecha" name="fecha" type="date">
                    </div>
                    
                    
                    <div class="acciones-formulario"><button id="boton-guardar" class="boton" type="submit">Registrarse</button><button id="boton-limpiar" class="boton boton-secundario"
                            type="reset">Limpiar</button></div>
                </form>
            </section>
        </div>
    </main>
    
</body>

</html>
