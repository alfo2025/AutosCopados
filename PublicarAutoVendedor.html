<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar auto</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/PublicacionModificacionAuto.css">
</head>
<body>
    <header class="cabecera">
        <div class="contenedor cabecera-contenido">
            <a class="marca" href="inicio.html">autos copados</a>
            <nav aria-label="Navegación principal">
                <ul class="menu">
                    <li><a class="activo" href="inicio.html">Inicio</a></li>
                    <li><a  href="login.html">LOG IN</a></li>
                    <li><a href="registro.html">Registrarse</a></li>
                   
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section id="formulario" class="caja">
            <h1>Rellene los datos</h1>
            <form action="" method="post">
                <div class="Seccion" id="Imagen">
                    <img src="./img/SeleccionAuto.avif" alt="" id="ImagenSeleccionada">
                    <div>
                        <div class="titulo">
                            <div class="icono">
                                <img src="./img/bienmal.jpg" alt="" class="iconoIMG">
                            </div>
                            <label for="SeleccionarIMG">Foto del auto:</label>
                        </div>
                        <input type="file" name="" id="SeleccionarIMG" accept="image/*">
                        <p id="MensajeFoto" class="Mensaje oculto">Respuesta referida al correo</p>
                    </div>
                </div>
                <div id="ConjuntoDatos">

                    <div class="Seccion" id="Nombre">
                        <div class="titulo">
                            <div class="icono">
                                <img src="./img/bienmal.jpg" alt="" class="iconoIMG">
                            </div>
                            <label for="nombre">Nombre:</label>
                        </div>
                        <input type="text" id="nombre" name="nombre">
                        <p id="MensajeNombre" class="oculto">Respuesta referida al correo</p>
                    </div>
    
                    <div class="Seccion">
                        <div class="titulo">
                            <div class="icono">
                                <img src="./img/bienmal.jpg" alt="" class="iconoIMG">
                            </div>
                            <label for="año">Año:</label>
                        </div>
                        <input type="date" name="" id="año">
                        <p id="añoMensaje" class="oculto">Respuesta a la fecha</p>
                    </div>
                    <div class="Seccion" id="kilometros">
                        <div class="titulo">
                            <div class="icono">
                                <img src="./img/bienmal.jpg" alt="" class="iconoIMG">
                            </div>
                            <label for="kilometros">Kilometros: </label>
                        </div>
                        <div class="Seccion">
                            <input type="number">
                            <p>km</p>
                        </div>
                    </div>
                    <div class="Seccion">
                        <div class="titulo">
                            <div class="icono">
                                <img src="./img/bienmal.jpg" alt="" class="iconoIMG">
                            </div>
                            <label for="marca">Marca: </label>
                        </div>
                        <select name="marca" id="marca">
                            <option value="" selected disabled hidden>Seleccione una Marca</option>
                            <option value="Toyota">Toyota</option>
                            <option value="Ford">Ford</option>
                            <option value="MercedesBenz">Mercedes Benz</option>
                            <option value="Hyundai">Hyundai</option>
                            <option value="Peugeot">Peugeot</option>
                            <option value="Smart">Smart</option>
                            <option value="Audi">Audi</option>
                        </select>
                    </div>
                </div>

                <button type="submit">Publicar</button>
            </form>
        </section>
    </main>
    <footer class="pie"><div class="contenedor"><p>autos copados - Proyecto PWM</p></div></footer>
    <script src="./js/publicarAuto.js"></script>
</body>
</html>
