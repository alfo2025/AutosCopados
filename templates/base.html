<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autos copados | log in</title>
    <link rel="stylesheet" href="../static/css/estilos.css">
    <link rel="stylesheet" href={{css}}>
</head>
<body>
    <header class="cabecera">
        <div class="contenedor cabecera-contenido">
            <a class="marca" href="inicio.html">Autos copados</a>
            <img src="../static/img/iconos/tresL.png" alt="" id="IconoOP"> 
        </div>
        <nav id="Menu" class="Cerrado" >
            <ul class="menu">
                {% if session.get('id') %}
                <li><a href="{{url_for('logout')}}">Cerrar Sesion</a></li>                
                <li class="usuario"><a href="./ListaAutosVendedor.html">Gestionar mis autos</a></li>
                <li class="usuario"><a href="./ListaAutosAdministrador.html">Administrar Usuarios</a></li> 
                <li class="usuario"><a href="./AprobarOfertas.html">Noctificacion de ofertas</a></li>  
                {% else %}
                <li class="publico"><a class="activo" href="{{url_for('inicio')}}">Inicio</a></li>
                <li class="publico"><a  href="{{url_for('login')}}">LOG IN</a></li>
                <li class="publico"><a href="registro.html">Registrarse</a></li>
                {%endif%}   
            </ul>
        </nav>
    </header>
    <main id="Cuerpo" class="{{clase}}">
        {% block content %}{% endblock %}
        <script src="{{url_for('static', filename = 'js/Menu.js')}}"></script>
    </main>
    <footer class="pie"><div class="contenedor"><p>autos copados - Proyecto PWM</p></div></footer>
</body>
</html>
