<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>autos copados | log in</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/LoginRegistrase.css">
</head>
<body>
    <header class="cabecera">
        <div class="contenedor cabecera-contenido">
            <a class="marca" href="inicio.html">Autos copados</a>
            <img src="./img/iconos/tresL.png" alt="" id="IconoOP"> 
        </div>
        <nav id="Menu" class="Cerrado" >
            <ul class="menu">
                <li class="publico"><a href="inicio.html">Inicio</a></li>
                <li class="publico"><a class="activo" href="login.html">LOG IN</a></li>
                <li class="publico"><a href="registro.html">Registrarse</a></li>                
                <li class="usuario"><a href="./ListaAutosVendedor.html">Gestionar mis autos</a></li>
                <li class="usuario"><a href="./ListaAutosAdministrador.html">Administrar Usuarios</a></li>        
            </ul>
        </nav>
    </header>    

    <main id="Cuerpo" class="formulario login">
        <div class="ImagenPublicidad">
            <img src="./img/Anuncio/anuncio.jpg" id="IMGLogin" alt="">
        </div>
        <div id="DatosLogin">
            <section class="introduccion" aria-labelledby="titulo-principal">
                <h1 id="titulo-principal">Bienvenido a autos copados</h1>
                <p>Ingresa tus datos para logearte!</p>
            </section>
    
           <section>
             <form id="formulario-login" action="#" method="post">
                <div class="">
                    <div class="titulo">
                        <label for="correo-usuario">Correo de usuario</label>
                        <div class="icono">
                            <img src="./img/bienmal.jpg" alt="" class="iconoIMG">
                        </div>
                    </div>
                    <input id="correo-usuario" name="correo-usuario" type="text" class="">
                    <p id="MensajeCorreo" class="oculto">Respuesta referida al correo</p>
                </div>
                <div class="">
                    <div class="titulo">
                        <label for="clave-usuario">Clave</label>
                        <div class="icono">
                            <img src="./img/bienmal.jpg" alt="" class="iconoIMG">
                        </div>
                    </div>
                    <input id="clave-usuario" name="clave-usuario" type="password" class="">
                    <p id="MensajeClave" class="oculto">mensaje clave</p>
                </div>
                <p id="MensajeAprobacion" class="">Ingrese los datos para ingesar a la secion</p>
                <div class="acciones-formulario">
                    <button id="boton-guardar" class="boton" type="submit">Ingresar</button>
                    <button id="boton-limpiar" class="boton boton-secundario" type="reset">Limpiar</button>
                </div>
            </form>
           </section>
        </div>
    </main>
    <script src="./js/Menu.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
